<!DOCTYPE html>
<html lang="es">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Imágenes - Ejercicio 16</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h1>Galería de Imágenes</h1>

    <figure>
        <img src="images/imagen-1.jpg" alt="Paisaje montañoso al amanecer" width="300" height="200" title="Amanecer en la montaña">
        <figcaption>Vista del amanecer desde la cima de una montaña.</figcaption>
    </figure>

    <figure>
        <img src="images/imagen-2.jpg" alt="Playa tropical con agua cristalina" width="300" height="200" title="Playa tropical">
        <figcaption>Playa de arena blanca con aguas turquesas.</figcaption>
    </figure>

    <figure>
        <img src="images/imagen-3.jpg" alt="Bosque con niebla entre los árboles" width="300" height="200" title="Bosque nevado">
        <figcaption>Bosque cubierto de niebla en una mañana fría.</figcaption>
    </figure>

    <figure>
        <img src="images/imagen-4.jpg" alt="Ciudad de noche con luces" width="300" height="200" title="Ciudad nocturna">
        <figcaption>Vista panorámica de una ciudad iluminada de noche.</figcaption>
    </figure>

    <figure>
        <img src="images/imagen-5.jpg" alt="Desierto con dunas doradas" width="300" height="200" title="Desierto al atardecer">
        <figcaption>Dunas doradas que se extienden hasta el horizonte.</figcaption>
    </figure>

    <figure>
        <img src="images/imagen-6.jpg" alt="Cascada rodeada de vegetación" width="300" height="200" title="Cascada tropical">
        <figcaption>Cascada rodeada de abundante vegetación tropical.</figcaption>
    </figure>
    <a href="index.html">Volver a la página principal</a>
</body>
</html>
